name: Publish Docker image

on:
  release:
    types: [published]

  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  PRIMARY_IMAGE_NAME: xbit18/violarr

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PRIMARY_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release-tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/build-push-action@v6
          attempt_limit: 3
          attempt_delay: 15000
          steps_context: ${{ toJSON(steps) }}
          with: |
            context: .
            platforms: linux/amd64,linux/arm64
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max